# NovaShop DevOps Store — Helm Values Yapılandırması
# Sistem Kaynak Bütçesi (PROFILES.md) Uyumlu

global:
  environment: local-kind
  domain: novashop.local

# 1. UI Storefront Mikroservisi (Spring Boot / Java 21)
ui:
  enabled: true
  replicaCount: 2
  image:
    repository: novashop-ui
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  env:
    ENDPOINTS_CATALOG: "http://novashop-catalog:8080"
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

# 2. Catalog Mikroservisi (Go Gin)
catalog:
  enabled: true
  replicaCount: 1
  image:
    repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
    tag: v1.6.2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5

# 3. Ingress Yapılandırması
ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: novashop.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: novashop-ui
            port: 8080

# 4. Prometheus Operator ServiceMonitor Yapılandırması
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels:
    release: prometheus
