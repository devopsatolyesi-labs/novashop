# NovaShop — Prometheus Metrik Toplama Yapılandırması
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1. Prometheus Kendi Metrikleri
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. NovaShop UI Spring Boot Actuator Metrikleri
  - job_name: "novashop-ui"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["ui:8080"]

  # 3. OpenTelemetry Collector Metrik Çıkışı
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
