# NovaShop — Kind Çok Düğümlü Yerel Kubernetes Küme Yapılandırması
# Sistem Kaynak Bütçesi (PROFILES.md) Uyumlu: 1 Control-Plane, 2 Worker
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: novashop-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # NodePort doğrudan erişimi (30080 -> 30080) — Port çakışması olmaması için ayrılmıştır
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

  - role: worker
    labels:
      tier: presentation
      node.kubernetes.io/instance-type: worker-1
    extraMounts:
      - hostPath: /var/log/containers
        containerPath: /var/log/containers
      - hostPath: /var/log/pods
        containerPath: /var/log/pods

  - role: worker
    labels:
      tier: application
      node.kubernetes.io/instance-type: worker-2
    extraMounts:
      - hostPath: /var/log/containers
        containerPath: /var/log/containers
      - hostPath: /var/log/pods
        containerPath: /var/log/pods
