# NovaShop DevOps Store — Nginx Reverse Proxy Configuration
# Altyapı Katmanı: AWS EC2 Public Subnet Web Katmanı
# Lab: LAB-02-AWS-BASICS

upstream novashop_backend {
    # İlerleyen lablarda Docker Compose veya Systemd servisi (UI / Catalog)
    # Varsayılan yerel backend portu (UI: 8080 veya 8888)
    server 127.0.0.1:8888 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Güvenlik Başlıkları (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Nginx sürüm numarasını gizle (Bilgi sızıntısını önler)
    server_tokens off;

    # İstemci gövde boyutu sınırı
    client_max_body_size 10M;

    # Erişim ve Hata Logları
    access_log /var/log/nginx/novashop_access.log;
    error_log /var/log/nginx/novashop_error.log warn;

    # 1. Sağlık Kontrolü Endpoint'i (Health Check)
    # AWS Target Group, ALB veya öğrenci curl testi için bağımsız 200 döner
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"novashop-proxy","timestamp":"$time_iso8601"}\n';
    }

    # 2. Sürüm Kontrolü Endpoint'i (Öğrenci Görevi için Referans)
    location = /version {
        default_type application/json;
        return 200 '{"version":"v0.1.0","app":"NovaShop DevOps Store","environment":"aws-manual"}\n';
    }

    # 3. Ana Uygulama Reverse Proxy Yönlendirmesi
    location / {
        proxy_pass http://novashop_backend;
        proxy_http_version 1.1;

        # Header İletimi
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman Aşımı Değerleri
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Arka uç henüz çalışmıyorsa bilgilendirici hata sayfası
        error_page 502 503 504 = @fallback_maintenance;
    }

    # Arka uç hazır değilken dönülecek geçici durum
    location @fallback_maintenance {
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>NovaShop - Bakım Modu</title><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}div{background:#1e293b;padding:2rem;border-radius:8px;max-width:500px;border:1px solid #334155;text-align:center;}h1{color:#38bdf8;font-size:1.5rem;}p{color:#94a3b8;font-size:0.95rem;}code{background:#0f172a;padding:0.2rem 0.4rem;border-radius:4px;color:#a5f3fc;}</style></head><body><div><h1>NovaShop Web Katmanı Aktif</h1><p>Nginx reverse proxy başarıyla çalışıyor. Backend uygulama servisi henüz başlatılmamış.</p><p>Sağlık kontrolü için: <code>/healthz</code></p></div></body></html>\n';
    }
}
