# NovaShop — GitLab CI Kurumsal Boru Hattı Yapılandırması
stages:
  - test
  - security
  - build-and-push

variables:
  HARBOR_HOST: "harbor.novashop.local:8443"
  HARBOR_PROJECT: "novashop"
  IMAGE_NAME: "$HARBOR_HOST/$HARBOR_PROJECT/novashop-ui"
  DOCKER_TLS_CERTDIR: ""

default:
  tags:
    - docker

# 1. Birim Testler
unit-tests:
  stage: test
  image: public.ecr.aws/amazonlinux/amazonlinux:2023
  before_script:
    - dnf install -y maven java-21-amazon-corretto-headless git
  script:
    - cd src/ui
    - ./mvnw clean test -B
  artifacts:
    when: always
    reports:
      junit: src/ui/target/surefire-reports/*.xml

# 2. Güvenlik Taraması
security-gates:
  stage: security
  image: bash:5.2
  before_script:
    - apk add --no-cache git grep
  script:
    - bash scripts/verify/verify-lab-08.sh

# 3. İmaj Derleme ve Harbor'a Gönderme
docker-build-push:
  stage: build-and-push
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - SHORT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
    - TARGET_TAG="sha-$SHORT_SHA"
    - echo "$HARBOR_ROBOT_SECRET" | docker login "$HARBOR_HOST" -u "$HARBOR_ROBOT_USER" --password-stdin
    - docker build -t "$IMAGE_NAME:$TARGET_TAG" src/ui
    - docker push "$IMAGE_NAME:$TARGET_TAG"
