# NovaShop — Gözlemlenebilirlik (Prometheus, Grafana, Jaeger, OTel) Yığını
# Sistem Kaynak Bütçesi (PROFILES.md) Uyumlu
services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: novashop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./alertmanager.yml:/etc/prometheus/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - novashop-observability-net
      - novashop-starter-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: novashop-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - novashop-observability-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: novashop-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set locally; do not commit it}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - novashop-observability-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: novashop-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - novashop-observability-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: novashop-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
    networks:
      - novashop-observability-net

networks:
  novashop-observability-net:
    driver: bridge
  # The starter helper creates this network. LAB-03 must be running first.
  novashop-starter-net:
    external: true
    name: novashop-starter_default
