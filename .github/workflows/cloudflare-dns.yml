name: Cloudflare DNS Automation

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: 'Öğrenci Kodu (Örn: student01, student100)'
        required: true
        default: 'student100'
      student_ip:
        description: 'Öğrenci Ubuntu Sunucu Dış IP Adresi'
        required: true
        default: '20.12.13.11'
      services:
        description: 'Eklenecek Servisler (virgülle ayrılmış)'
        required: true
        default: 'novashop,gitlab,harbor,sonarqube,jenkins'
      action:
        description: 'İşlem Tipi'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - delete

jobs:
  configure-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cloudflare DNS Script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: 'devopsatolyesi.com'
        run: |
          chmod +x scripts/instructor/cloudflare-dns.sh
          ./scripts/instructor/cloudflare-dns.sh "${{ inputs.action }}" "${{ inputs.student_id }}" "${{ inputs.student_ip }}" "${{ inputs.services }}"
