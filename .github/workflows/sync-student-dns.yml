name: Sync Student DNS (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: 'Öğrenci Kodu (örn: student01 veya student100)'
        required: true
        default: 'student01'
      vm_ip:
        description: 'Öğrencinin Ubuntu Sunucu Dış IP Adresi'
        required: true
        default: '34.77.187.127'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloudflare DNS Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ github.event.inputs.student_id }},${{ github.event.inputs.vm_ip }}" > temp_student.csv
          python3 scripts/cloudflare/sync_dns.py temp_student.csv
