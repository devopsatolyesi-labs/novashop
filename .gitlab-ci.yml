# ==============================================================================
# NovaShop — GitLab CI/CD Pipeline
# Cloudflare DNS & SSL Proxy Otomasyonu (Eğitmen Tetiklemeli)
# ==============================================================================

stages:
  - dns-automation

cloudflare_dns_sync:
  stage: dns-automation
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: manual
  variables:
    STUDENT_ID: "student100"
    STUDENT_IP: "1.2.3.4"
    SERVICES: "novashop,gitlab,harbor,sonarqube,jenkins"
    DOMAIN_NAME: "devopsatolyesi.com"
  before_script:
    - apk add --no-cache bash curl grep jq
  script:
    - chmod +x scripts/instructor/cloudflare-dns.sh
    - ./scripts/instructor/cloudflare-dns.sh apply "${STUDENT_ID}" "${STUDENT_IP}" "${SERVICES}"
