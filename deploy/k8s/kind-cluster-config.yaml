# NovaShop — Kind Çok Düğümlü Yerel Kubernetes Küme Yapılandırması
# Sistem Kaynak Bütçesi (PROFILES.md) Uyumlu: 1 Control-Plane, 2 Worker
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: novashop-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # NodePort doğrudan erişimi (30080 -> 8888)
      - containerPort: 30080
        hostPort: 8888
        protocol: TCP
      # Ingress HTTP (80 -> 80)
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Ingress HTTPS (443 -> 8443)
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
    labels:
      tier: presentation
      node.kubernetes.io/instance-type: worker-1

  - role: worker
    labels:
      tier: application
      node.kubernetes.io/instance-type: worker-2
