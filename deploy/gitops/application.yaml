apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-gitops
  namespace: argocd
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/part-of: novashop-store
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/devopsatolyesi-labs/novashop.git
    targetRevision: HEAD
    path: charts/novashop
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: novashop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
